<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="view-transition" content="same-origin" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0f0f10" />
  <title>Pedidos · Protocol Data</title>

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/panel.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pedidos.css" />
</head>

<body data-page="pedidos">
  <div class="appShell">
    <div class="bodyGrid">
      <aside class="sidebar" aria-label="Navegación" data-include="sidebar"></aside>

      <main class="main" aria-label="Contenido principal">
        <header class="appHeader pdTopbar" aria-label="Encabezado general">
          <div class="pdTopbar__brand">Protocol Data</div>

          <div class="pdWorkspaceSwitch" aria-label="Workspace actual: Al Paso Store">
            <span class="pdWorkspaceSwitch__copy">
              <strong>Al Paso Store</strong>
              <small>Workspace</small>
            </span>
            <span class="pdWorkspaceSwitch__avatar" aria-hidden="true">A</span>
            <span class="pdWorkspaceSwitch__chevron" aria-hidden="true">⌄</span>
          </div>
        </header>

        <section class="ordersWorkspace">
          <header class="ordersPageHeader">
            <div>
              <h1>Pedidos</h1>
              <p>Centro operativo de ventas, cobros y estado logístico.</p>
            </div>
          </header>

          <section class="ordersToolbar" aria-label="Herramientas de pedidos">
            <header class="ordersBlockHeader">
              <div class="ordersBlockHeader__copy">
                <h2>Herramientas</h2>
                <span>Buscá, filtrá y acotá el período operativo.</span>
              </div>
            </header>

            <div class="ordersToolbar__main">
              <label class="ordersSearchField" for="ordersSearch">
                <span class="ordersSearchField__icon" aria-hidden="true">⌕</span>
                <input id="ordersSearch" type="search" placeholder="Buscar por ID, email, cliente, SKU o tracking…" autocomplete="off" />
              </label>

              <div class="dateFilter" id="dateFilter">
                <button class="dateFilter__btn" id="btnToggleDates" type="button" aria-haspopup="true" aria-expanded="false">
                  <span>Fechas</span>
                  <span aria-hidden="true">⌄</span>
                </button>

                <div class="dateFilter__panel" id="datePanel" aria-label="Selector de fechas" hidden>
                  <div class="dateFilter__presets">
                    <button class="filterPill" type="button" data-preset="today">Hoy</button>
                    <button class="filterPill" type="button" data-preset="yesterday">Ayer</button>
                    <button class="filterPill" type="button" data-preset="last7">Últimos 7 días</button>
                    <button class="filterPill" type="button" data-preset="month">Este mes</button>
                  </div>

                  <div class="dateFilter__range">
                    <label class="filterField">
                      <span>Desde</span>
                      <input id="dtFrom" type="datetime-local" />
                    </label>

                    <label class="filterField">
                      <span>Hasta</span>
                      <input id="dtTo" type="datetime-local" />
                    </label>

                    <button class="filterApply" id="btnApplyRange" type="button">Aplicar período</button>
                  </div>
                </div>
              </div>

              <button class="ordersClear" id="btnClearOrders" type="button">Limpiar</button>
            </div>

            <div class="ordersQuickFilters" aria-label="Filtros rápidos por estado">
              <span class="ordersQuickFilters__label">Estado</span>
              <button class="filterPill" type="button" data-quick="pendiente">Pendiente</button>
              <button class="filterPill" type="button" data-quick="despachado">Despachado</button>
              <button class="filterPill" type="button" data-quick="entregado">Entregado</button>
              <button class="filterPill" type="button" data-quick="intervenido">Intervenido</button>
            </div>
          </section>

          <section class="ordersPanel" aria-label="Listado de pedidos">
            <header class="ordersPanelHeader">
              <div class="ordersPanelHeader__copy">
                <h2>Pedidos</h2>
                <span id="ordersInfo">—</span>
              </div>

              <div class="ordersPager" aria-label="Paginación de pedidos">
                <button class="pagerBtn pagerBtn--icon" id="btnPrevOrders" type="button" disabled aria-label="Anterior">‹</button>
                <div class="pagerMeta" id="ordersPagerMeta">—</div>
                <button class="pagerBtn pagerBtn--icon pagerBtn--primary" id="btnNextOrders" type="button" disabled aria-label="Siguiente">›</button>
              </div>
            </header>

            <div id="ordersList" class="list ordersList" aria-label="Listado">
              <div class="u-muted">Cargando…</div>
            </div>
          </section>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/pedidos.js"></script>
</body>
</html>
