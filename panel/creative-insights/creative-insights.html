<body data-page="creative-insights">

    <div class="bodyGrid">
      <aside

        data-include="sidebar"
        aria-label="Navegación principal"
      ></aside>

      <main class="main ciMain" aria-label="Creative Insights">
        <div class="ciShell" data-ci-shell>
          <nav class="ciModuleRail" aria-label="Secciones de Creative Insights">
            <div class="ciRailItems">
              <button
                type="button"
                class="ciRailButton"
                data-ci-section="inicio"
                data-tooltip="Inicio"
                aria-label="Inicio"
              >
                <span class="material-symbols-rounded" aria-hidden="true">home</span>
              </button>

              <button
                type="button"
                class="ciRailButton"
                data-ci-section="consignaciones"
                data-tooltip="Consignaciones"
                aria-label="Consignaciones"
              >
                <span class="material-symbols-rounded" aria-hidden="true">assignment</span>
              </button>

              <button
                type="button"
                class="ciRailButton"
                data-ci-section="entregas"
                data-tooltip="Entregas"
                aria-label="Entregas"
              >
                <span class="material-symbols-rounded" aria-hidden="true">upload_file</span>
              </button>

              <button
                type="button"
                class="ciRailButton"
                data-ci-section="revision"
                data-tooltip="Revisión"
                aria-label="Revisión"
              >
                <span class="material-symbols-rounded" aria-hidden="true">fact_check</span>
              </button>

              <button
                type="button"
                class="ciRailButton"
                data-ci-section="negociaciones"
                data-tooltip="Negociaciones"
                aria-label="Negociaciones"
              >
                <span class="material-symbols-rounded" aria-hidden="true">forum</span>
              </button>

              <button
                type="button"
                class="ciRailButton"
                data-ci-section="compras"
                data-tooltip="Compras y pagos"
                aria-label="Compras y pagos"
              >
                <span class="material-symbols-rounded" aria-hidden="true">payments</span>
              </button>

              <button
                type="button"
                class="ciRailButton"
                data-ci-section="biblioteca"
                data-tooltip="Biblioteca"
                aria-label="Biblioteca"
              >
                <span class="material-symbols-rounded" aria-hidden="true">video_library</span>
              </button>

              <button
                type="button"
                class="ciRailButton"
                data-ci-section="creadores"
                data-tooltip="Creadores"
                aria-label="Creadores"
              >
                <span class="material-symbols-rounded" aria-hidden="true">group</span>
              </button>

              <button
                type="button"
                class="ciRailButton"
                data-ci-section="incidencias"
                data-tooltip="Incidencias"
                aria-label="Incidencias"
              >
                <span class="material-symbols-rounded" aria-hidden="true">report</span>
              </button>
            </div>
          </nav>

          <section class="ciWorkspace">
            <header class="ciTopbar">
              <div class="ciTopbarBrand">
                <span class="material-symbols-rounded ciTopbarBrand__icon" aria-hidden="true">
                  auto_awesome
                </span>
                <span>Creative Insights</span>
              </div>

              <div class="ciTopbarContext">
                Protocol Data
              </div>
            </header>

            <div class="ciView">
              <header class="ciViewHeader">
                <div class="ciEyebrow">Operator console</div>

                <h1 class="ciViewTitle" data-ci-current-title>
                  Inicio
                </h1>

                <p class="ciViewSubtitle" data-ci-current-subtitle>
                  Control operativo
                </p>
              </header>

              <section class="ciStage" aria-label="Área de trabajo de Creative Insights">
                <div class="ciStageEmpty">
                  <span
                    class="material-symbols-rounded ciStageEmpty__icon"
                    aria-hidden="true"
                  >
                    space_dashboard
                  </span>

                  <div class="ciStageEmpty__copy">
                    <strong>Shell de Creative Insights</strong>
                    <span>
                      Navegación contextual y base visual listas para conectar las vistas operativas.
                    </span>
                  </div>
                </div>
              </section>
